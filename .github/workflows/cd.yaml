name: CD devops 2025
on:
  workflow_run:
    workflows: ["CI devops 2025"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push simpleapi
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simpleapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simpleapi:${{ github.event.workflow_run.head_sha }}

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: ./devops-front
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/front:${{ github.event.workflow_run.head_sha }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/database:${{ github.event.workflow_run.head_sha }}

      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/httpserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/httpserver:${{ github.event.workflow_run.head_sha }}


  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Ansible image
        run: docker build -t ansible-runner project-ansible

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H quentin.dufour.takima.school >> ~/.ssh/known_hosts

      - name: Write vault password
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: echo "$VAULT_PASS" > "$RUNNER_TEMP/vault_pass"

      - name: Deploy with Ansible (Docker + vault)
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE/project-ansible/ansible:/ansible"
          -v "$HOME/.ssh:/root/.ssh:ro"
          -v "$RUNNER_TEMP/vault_pass:/vault_pass:ro"
          ansible-runner
          -i inventories/setup.yml playbook.yml
          --vault-password-file /vault_pass
          -e image_tag=${{ github.event.workflow_run.head_sha }}

      - name: Remove vault password
        if: always()
        run: rm -f "$RUNNER_TEMP/vault_pass"
